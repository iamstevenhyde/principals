<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principals Host</title><link rel="icon" href="data:,"><link rel="stylesheet" href="pages/style.css">
<style>.ctl button{min-width:120px}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head><body><div class="wrap" id="app"><h1>Principals: host</h1><p class="mute">Loading.</p></div>
<script type="module">
import { openStore, params, hostToken, saveHostToken, pageMode } from './pages/store.js';
import { Host } from './pages/host.js';
import { esc, fmtClock, SEAT_ICON, ICON, COLORS } from './pages/render.js';
import { SEAT_LABEL, revealSteps } from './engine/engine.js';
const app = document.getElementById('app');
const store = await openStore();
let code = params().get('g'), host = null, lastHtml = '';
const q = (u) => u + (pageMode() === 'local' && params().get('local') === '1' ? '&local=1' : '');

async function newGame() {
  const s = await store.createSession();
  saveHostToken(s.code, s.hostToken);
  location.search = '?g=' + s.code + (params().get('local') === '1' ? '&local=1' : '');
}
if (!code) {
  app.innerHTML = `<h1>Principals: host</h1><div class="card"><p>Mode: <b>${pageMode()}</b>. ${pageMode() === 'local' ? 'Everything stays in this browser. Open player tabs from the lobby.' : 'Live on Supabase.'}</p><button class="primary" id="new">New game</button></div>`;
  document.getElementById('new').onclick = newGame;
} else {
  const tok = hostToken(code);
  if (!tok) app.innerHTML = '<p class="err">This browser does not hold the host token for ' + esc(code) + '. Open it from the browser that created the game.</p>';
  else {
    host = new Host(store, code, tok);
    await host.load({ boardCount: 4 });
    host.start();
    window.__host = host;   // read by test/headless.mjs to seat a test player as Chair
    host.onChange(render);
    render(host.state);
  }
}

document.addEventListener('keydown', e => { if (!host || !host.state || host.state.phase !== 'reveal' || /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return; if (e.key === 'ArrowRight') host.act({ type: 'reveal_step', delta: 1 }); if (e.key === 'ArrowLeft') host.act({ type: 'reveal_step', delta: -1 }); });

function lobby(st, joinUrl) {
  const D = st.draft, byId = Object.fromEntries(st.players.map(p => [p.id, p]));
  const where = {};
  for (const bid of D.boards) for (const k of Object.keys(D.seats[bid])) if (D.seats[bid][k]) where[D.seats[bid][k]] = (st.content.boards.find(b => b.id === bid) || {}).name;
  const opts = cur => '<option value="">(empty)</option>' + st.players.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}" ${p.id === cur ? 'selected' : ''}>${esc(p.name)}${where[p.id] && p.id !== cur ? ' - ' + esc(where[p.id]) : ''}</option>`).join('');
  const waiting = st.players.filter(p => !where[p.id]);
  const nPlaced = st.players.length - waiting.length;
  const face = n => `<span class="face" style="background:${COLORS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length]}">${esc(n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase())}</span>`;
  const board = bid => { const bc = st.content.boards.find(b => b.id === bid), seats = Object.keys(D.seats[bid]).filter(k => !k.endsWith('2') || st.players.length > 6 * D.boards.length || D.seats[bid][k]); return `<div class="card bcard"><h3>${esc(bc.name)} <span class="pill">${seats.filter(k => D.seats[bid][k]).length}/6</span></h3>
    ${seats.map(k => { const pid = D.seats[bid][k]; return `<div class="srow" title="${esc(SEAT_LABEL[k.replace('2', '')])}">${SEAT_ICON[k.replace('2', '')]}<select data-board="${bid}" data-seat="${k}" aria-label="${esc(SEAT_LABEL[k.replace('2', '')])}">${opts(pid)}</select>${pid ? `<button class="star ${D.chairs[bid] === pid ? 'on' : ''}" data-board="${bid}" data-star="${pid}" title="Chair">${ICON.crown}</button>` : '<span></span>'}</div>`; }).join('')}</div>`; };
  return `<div class="card herohost"><div class="qr" id="qr"></div><div><div class="bigcount">${st.players.length}</div><div class="mute">in the waiting room</div><div class="small">Code <b>${esc(st.code)}</b> <code>${esc(joinUrl)}</code></div></div>
    <div style="flex:1"></div><div class="row"><label>Boards <select id="nb">${[1, 2, 3, 4, 5, 6].map(n => `<option ${n === st.settings.boardCount ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <button id="auto2">${ICON.swap} Assign automatically</button><button id="clr">Clear</button>
    <button class="primary" id="start">Start game (${nPlaced}/${st.players.length} placed)</button>
    ${pageMode() === 'local' ? '<button id="bots">Add 5 simulated players</button><button id="tabs">Open 3 player tabs</button>' : ''}</div>
    <span class="mute small" style="flex-basis:100%">Six seats per board. With more than 36 students, partners share a seat. Anyone left unplaced is dealt a seat when you start.</span></div>
  <div class="card"><h2>Waiting room ${waiting.length ? `<span class="pill">${waiting.length}</span>` : ''}</h2><div class="chipgrid">${waiting.map(p => `<span class="pchip">${face(p.name)}${esc(p.name)}</span>`).join('') || '<span class="mute">Everyone is placed.</span>'}</div></div>
  <div class="hostgrid">${D.boards.map(board).join('')}
  </div>`;
}
function render(st) {
  const ae = document.activeElement; if (ae && ((ae.id && ae.id.startsWith('tm_')) || ae.tagName === 'SELECT')) return;
  if (st.phase === 'lobby' && !st.draft) { host.act({ type: 'draft_clear' }); }   // don't wipe a timer edit
  const P = st, t = Date.now();
  const left = st.clock ? (st.clock.paused ? st.clock.remaining : Math.max(0, st.clock.endsAt - t)) : null;
  const base = location.href.split('admin.html')[0];
  const joinUrl = base + 'index.html?g=' + st.code;
  const boards = Object.values(st.boards);
  const focus = document.activeElement && document.activeElement.id;
  const html = `
  <div class="row"><h1 style="flex:1">Principals: host <span class="pill">${esc(st.code)}</span></h1><span class="clock" id="hclk"></span></div>
  <div class="card row ctl">
    <b>Phase:</b> ${esc(st.phase)}
    <a href="${q('projector.html?g=' + st.code)}" target="_blank">Open projector</a>
    <a href="${q('index.html?g=' + st.code)}" target="_blank">Join link</a>
  </div>
  ${st.phase === 'lobby' ? lobby(st, joinUrl) : `
  <div class="card row ctl">
    <button class="primary" id="adv">${st.phase === 'play' ? 'End meeting and reveal' : 'Done'}</button>
    <button id="pause">${st.clock && st.clock.paused ? 'Resume' : 'Pause'}</button>
    <button id="add30">+30 s</button><button id="add60">+60 s</button>
    <label class="row small"><input type="checkbox" id="auto" ${st.settings.autoAdvance ? 'checked' : ''}> auto-advance</label>
    ${pageMode() === 'local' ? '<button id="bots">Add 5 simulated players</button>' : ''}
  </div>`}
  <details class="card small" id="tmbox"><summary><b>Timer</b> (meeting length in minutes)</summary><div class="row" style="margin-top:6px"><label>meeting length (min) <input id="tm_play" type="number" min="1" step="0.5" style="width:80px" value="${st.settings.timers.play / 60}"></label><button id="savetm">Save timer</button></div></details>
  ${boards.length ? `<div class="card"><h2>Boards</h2>${boards.map(b => { const ds = Object.values(st.seats).filter(x => x.board === b.id); return `<div class="row small" style="border-top:1px solid var(--line);padding:6px 0"><b style="min-width:140px">${esc(b.content.name)}</b>
     voted ${ds.filter(x => b.ballots[x.id]).length}/${ds.length} | ${b.locked ? 'chose ' + (b.choice || 'nothing') : 'open'} | chair ${esc((st.seats[b.chair] || {}).name || '-')}
     | ${ds.map(x => esc(x.name)).join(', ')}</div>`; }).join('')}</div>` : ''}
  ${st.phase === 'reveal' ? `<div class="card row ctl"><b>Debrief: one screen per board. Projector shows</b>${Object.values(st.boards).map((b, i) => `<button class="${(st.revealStep || 0) === i ? 'primary' : ''}" data-rb="${i}">${esc(b.content.short || b.content.name)}</button>`).join('')}<span class="mute small">Arrow keys also switch boards.</span></div>` : ''}
  <p class="small mute">Keep this tab open: it runs the game. ${host.lastError ? '<span class="err">' + esc(host.lastError) + '</span>' : ''}</p>`;
  const paint = () => { const c = document.getElementById('hclk'); if (c) c.textContent = fmtClock(left); };
  if (html === lastHtml) { paint(); return; }
  lastHtml = html; app.innerHTML = html; paint();
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on('start', () => host.act({ type: 'start' }));
  on('adv', () => host.act({ type: 'advance' }));
  on('pause', () => host.act({ type: st.clock && st.clock.paused ? 'resume' : 'pause' }));
  on('add30', () => host.act({ type: 'add_time', secs: 30 })); on('add60', () => host.act({ type: 'add_time', secs: 60 }));
  on('bots', () => { host.addBots(5); render(host.state); });
  on('tabs', () => { for (let i = 0; i < 3; i++) window.open(q('index.html?g=' + st.code), '_blank'); });
  on('savetm', () => host.act({ type: 'set_timers', timers: { play: (Number(document.getElementById('tm_play').value) || st.settings.timers.play / 60) * 60 } }));
  document.querySelectorAll('[data-rb]').forEach(el => el.onclick = () => host.act({ type: 'reveal_step', to: +el.dataset.rb }));
  const auto = document.getElementById('auto'); if (auto) auto.onchange = () => host.act({ type: 'auto', on: auto.checked });
  const nb = document.getElementById('nb'); if (nb) nb.onchange = () => { document.activeElement.blur(); host.act({ type: 'set_boards', n: Number(nb.value) }); render(host.state); };
  const act = a => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); host.act(a); render(host.state); };
  on('auto2', () => act({ type: 'draft_auto' })); on('clr', () => act({ type: 'draft_clear' }));
  document.querySelectorAll('[data-seat]').forEach(el => el.onchange = () => act({ type: 'draft_seat', board: el.dataset.board, seat: el.dataset.seat, player: el.value || null }));
  document.querySelectorAll('[data-star]').forEach(el => el.onclick = () => act({ type: 'draft_chair', board: el.dataset.board, player: el.dataset.star }));
  const qr = document.getElementById('qr'); if (qr) { try { new QRCode(qr, { text: joinUrl, width: 150, height: 150 }); } catch (e) { qr.textContent = ''; qr.style.display = 'none'; } }
  if (focus && focus.startsWith('tm_')) { const el = document.getElementById(focus); if (el) el.focus(); }
}
</script></body></html>
