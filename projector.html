<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principals Projector</title><link rel="icon" href="data:,"><link rel="stylesheet" href="pages/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.top{display:flex;align-items:center;gap:16px}.top h1{flex:1}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.names{columns:3;font-size:1.1rem}
@media(max-width:700px){.lobby{grid-template-columns:1fr}.names{columns:1}}
</style></head><body><div class="proj" id="app"><p class="mute">Loading.</p></div>
<script type="module">
import { openStore, params } from './pages/store.js';
import { esc, fmtClock, seatingGrid, seatingPlay, revealScreen } from './pages/render.js';
const app = document.getElementById('app');
const code = (params().get('g') || '').toUpperCase();
const store = await openStore();
let P = null, got = 0, qrDone = false;
async function load() { try { P = await store.publicView(code); got = Date.now(); render(); } catch (e) { app.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; } }
store.subscribe(code, load); load();
setInterval(() => { if (P && P.clockLeft != null && !P.paused) { const el = document.getElementById('clk'); if (el) el.textContent = fmtClock(Math.max(0, P.clockLeft - (Date.now() - got))); } }, 250);
function render() {
  if (!P) { app.innerHTML = '<p class="err">No game ' + esc(code) + '.</p>'; return; }
  const joinUrl = location.href.split('projector.html')[0] + 'index.html?g=' + code + (params().get('local') === '1' ? '&local=1' : '');
  const placed = P.seating && P.seating.boards.some(b => b.members.length);
  if (P.phase === 'lobby' && placed) {   // host has started placing people: show who sits where, keep the join QR small
    qrDone = false;
    app.innerHTML = `<section class="meeting seating lobseat"><header class="mhd"><h1>Principals: your seat</h1><div class="join"><div class="qr" id="qr"></div><div>Code <b>${esc(code)}</b><br>${P.seating.waiting} not yet placed</div></div></header>${seatingGrid(P)}</section>`;
    try { new QRCode(document.getElementById('qr'), { text: joinUrl, width: 120, height: 120 }); } catch (e) { document.getElementById('qr').textContent = ''; }
    return;
  }
  if (P.phase === 'lobby') {
    const head = `<div class="top"><h1>Principals</h1><span class="pill">${esc(code)}</span></div>`;
    if (qrDone && document.getElementById('qr')) { document.getElementById('names').innerHTML = (P.players || []).map(esc).join('<br>'); document.getElementById('cnt').textContent = (P.players || []).length; return; }
    app.innerHTML = head + `<div class="lobby"><div><div class="qr" id="qr"></div><p class="small">${esc(joinUrl)}</p></div>
      <div><h2>Join on your phone. Code <b>${esc(code)}</b></h2><p><b id="cnt" style="font-size:2.4rem">${(P.players || []).length}</b> in the waiting room</p><div class="names" id="names">${(P.players || []).map(esc).join('<br>')}</div></div></div>`;
    try { new QRCode(document.getElementById('qr'), { text: joinUrl, width: 280, height: 280 }); } catch (e) { document.getElementById('qr').textContent = 'QR needs the network; use the link.'; }
    qrDone = true; return;
  }
  qrDone = false;
  if (P.phase === 'reveal') { app.innerHTML = revealScreen(P.reveal); return; }
  app.innerHTML = seatingPlay(P);
  const el = document.getElementById('clk'); if (el) el.textContent = fmtClock(P.clockLeft);
}
</script></body></html>
